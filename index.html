<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f172a">
    <meta name="description" content="No Homework — a realistic A4/A5 notebook you can type, sketch, and export.">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>No Homework Notebook</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/pwa-192x192.png">
</head>
<body class="min-h-screen bg-slate-200 text-slate-800 antialiased">
    <div id="app" class="app-chrome mx-auto flex min-h-screen w-full max-w-6xl flex-col px-4 py-4 sm:px-6 sm:py-6">

        <!-- ============================ Header ============================ -->
        <header class="mb-5 flex flex-col gap-4">
            <!-- Brand row -->
            <div class="flex items-center justify-between gap-4">
                <div class="flex items-center gap-3">
                    <div
                        class="grid h-11 w-11 place-items-center rounded-2xl bg-gradient-to-br from-indigo-500 to-violet-600 text-white shadow-lg shadow-indigo-500/25">
                        <!-- notebook icon -->
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                            stroke-linecap="round" stroke-linejoin="round" class="h-6 w-6">
                            <path d="M8 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2h-2" />
                            <path d="M8 21V3" />
                            <path d="M12 8h4M12 12h4M12 16h4" />
                        </svg>
                    </div>
                    <div>
                        <h1 class="text-xl font-bold leading-tight text-slate-900 sm:text-2xl">No Homework Notebook</h1>
                        <p class="text-xs text-slate-500">Realistic paper · sketch · take notes</p>
                    </div>
                </div>

                <!-- Paper size segmented control -->
                <div class="flex items-center gap-1 rounded-full border border-slate-300 bg-white p-1 shadow-sm">
                    <button class="size-btn active" data-size="a4">A4</button>
                    <button class="size-btn" data-size="a5">A5</button>
                </div>
            </div>

            <!-- ------------------------------------------------------------ -->
            <!-- Toolbar                                                      -->
            <!-- ------------------------------------------------------------ -->
            <div class="flex flex-wrap items-center gap-2 rounded-2xl border border-slate-300 bg-white p-2 shadow-sm">

                <!-- Draw / type mode toggle -->
                <div class="flex items-center rounded-xl bg-slate-100 p-1">
                    <button id="drawBtn" class="icon-btn" title="Toggle drawing mode">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                            stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4">
                            <circle cx="12" cy="12" r="9.5" />
                            <path d="M7.5 12h9M12 7.5v9" />
                        </svg>
                        Draw
                    </button>
                </div>

                <div class="h-8 w-px bg-slate-200" aria-hidden="true"></div>

                <!-- Ink controls -->
                <div class="flex items-center gap-2 px-1">
                    <label for="inkColor" class="text-xs font-medium text-slate-500">Ink</label>
                    <input type="color" id="inkColor" value="#000000" title="Ink color"
                        class="h-8 w-9 cursor-pointer rounded-lg border border-slate-300 bg-white p-0.5">
                    <select id="inkWeight" title="Pen thickness"
                        class="h-8 cursor-pointer rounded-lg border border-slate-300 bg-white text-sm font-medium text-slate-700 focus:border-indigo-500 focus:outline-none">
                        <option value="1">Fine</option>
                        <option value="2" selected>Medium</option>
                        <option value="4">Bold</option>
                        <option value="7">Marker</option>
                    </select>
                </div>

                <div class="h-8 w-px bg-slate-200" aria-hidden="true"></div>

                <!-- Actions -->
                <div class="ml-auto flex items-center gap-1">
                    <label for="exportScale"
                        class="hidden items-center gap-1 pl-2 text-xs font-medium text-slate-500 sm:flex">
                        Quality
                    </label>
                    <select id="exportScale" title="Export quality"
                        class="h-8 cursor-pointer rounded-lg border border-slate-300 bg-white text-sm font-medium text-slate-700 focus:border-indigo-500 focus:outline-none">
                        <option value="1">Screen</option>
                        <option value="1.5625" selected>150 DPI</option>
                        <option value="3.125">300 DPI</option>
                        <option value="6.25">600 DPI</option>
                    </select>
                    <button id="clearBtn" class="icon-btn" title="Clear the page">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                            stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4">
                            <path d="M3 6h18" />
                            <path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2" />
                            <path d="M6 6l1 14a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-14" />
                            <path d="M10 11v6M14 11v6" />
                        </svg>
                        Clear
                    </button>
                    <button id="exportBtn" class="icon-btn icon-btn-active" title="Download the page as a PNG">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                            stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                            <path d="M7 10l5 5 5-5M12 15V3" />
                        </svg>
                        Download PNG
                    </button>
                </div>
            </div>
        </header>

        <!-- ============================ Canvas ============================ -->
        <main class="flex flex-1 flex-col items-center justify-start gap-4">
            <div class="notebook-page a4" id="notebookPage">
                <div class="content-area" contenteditable="true" id="contentArea"></div>
            </div>
        </main>

        <!-- ============================ Footer ============================ -->
        <footer
            class="app-chrome mt-5 flex flex-wrap items-center justify-between gap-3 rounded-2xl border border-slate-300/70 bg-white/70 px-4 py-2.5 text-sm backdrop-blur">
            <div class="flex flex-wrap items-center gap-x-5 gap-y-1">
                <span class="inline-flex items-center gap-1.5 text-slate-600">
                    <!-- GPU chip icon -->
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                        stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4 text-slate-400">
                        <rect x="4" y="6" width="16" height="12" rx="2" />
                        <path d="M9 1v5h6V1M9 18v5h6v-5M1 9h5v6H1M18 9h5v6h-5" />
                    </svg>
                    <span class="text-slate-500">GPU:</span>
                    <span id="gpuStatus" class="font-medium text-slate-700">Checking…</span>
                </span>

                <span class="inline-flex items-center gap-1.5 text-slate-600">
                    <span class="text-slate-500">Renderer:</span>
                    <span id="renderMode" class="font-medium text-slate-700">Canvas 2D</span>
                </span>

                <span class="inline-flex items-center gap-1.5 text-slate-600">
                    <span class="text-slate-500">Spacing:</span>
                    <span id="lineSpacing" class="font-medium text-slate-700">8mm</span>
                </span>

                <span class="inline-flex items-center gap-1.5 text-slate-600">
                    <span class="text-slate-500">Standard:</span>
                    <span id="standard" class="font-medium text-slate-700">German DIN</span>
                </span>

                <span class="inline-flex items-center gap-1.5 text-slate-600">
                    <span class="text-slate-500">Export:</span>
                    <span id="exportStatus" class="font-medium text-slate-700">150 DPI</span>
                </span>
            </div>

            <span id="saveStatus"
                class="inline-flex items-center gap-1.5 rounded-full bg-emerald-50 px-3 py-1 text-xs font-medium text-emerald-700 ring-1 ring-emerald-200">
                <!-- check icon -->
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                    stroke-linecap="round" stroke-linejoin="round" class="h-3.5 w-3.5">
                    <path d="M20 6L9 17l-5-5" />
                </svg>
                Auto-save
            </span>
        </footer>
    </div>

    <script type="module" src="/src/main.ts"></script>
</body>
</html>
