<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#f9f7f1">
    <meta name="description" content="Realistic A4/A5 notebook with drawing capabilities">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>No Homework Notebook - Realistic Paper</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/pwa-192x192.png">
    <style>
        :root {
            /* Paper dimensions - Universal ISO 216 Standard */
            --a4-width: 210mm;
            --a4-height: 297mm;
            --a5-width: 148mm;
            --a5-height: 210mm;
            
            /* German DIN standard ruling */
            --line-spacing: 8mm;
            --margin-width: 20mm;
            --line-color: #4a90e2;
            --line-opacity: 0.3;
            --paper-color: #f9f7f1;
            --margin-color: #d32f2f;
            --margin-opacity: 0.1;
            
            /* UI colors */
            --primary: #2c3e50;
            --secondary: #3498db;
            --accent: #e74c3c;
            --light: #ecf0f1;
            --dark: #2c3e50;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f5f5f5;
            color: var(--dark);
            overflow-x: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            touch-action: manipulation;
        }

        #app {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Header and Controls */
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--secondary);
            flex-wrap: wrap;
            gap: 15px;
        }

        .app-header h1 {
            font-size: 1.8rem;
            color: var(--primary);
            margin: 0;
        }

        .controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .size-btn, .control-btn {
            padding: 10px 20px;
            border: 2px solid var(--secondary);
            background: white;
            color: var(--secondary);
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1rem;
            user-select: none;
        }

        .size-btn.active, .control-btn:hover {
            background: var(--secondary);
            color: white;
        }

        .size-btn:not(.active):hover {
            background: rgba(52, 152, 219, 0.1);
        }

        .ruling-info {
            display: flex;
            gap: 20px;
            font-size: 0.9rem;
            color: var(--primary);
        }

        .ink-controls {
            align-items: center;
            gap: 8px;
        }

        .ink-label {
            font-weight: bold;
            color: var(--primary);
            font-size: 0.9rem;
        }

        .ink-controls input[type="color"] {
            width: 36px;
            height: 32px;
            border: 2px solid var(--secondary);
            border-radius: 5px;
            padding: 2px;
            cursor: pointer;
            background: white;
        }

        .ink-controls select {
            padding: 5px 8px;
            border: 2px solid var(--secondary);
            border-radius: 5px;
            background: white;
            color: var(--primary);
            font-weight: bold;
            cursor: pointer;
        }

        /* Notebook Container */
        .notebook-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            flex-grow: 1;
        }

        /* Notebook Page */
        .notebook-page {
            position: relative;
            background: white;
            box-shadow: 
                0 1px 2px rgba(0, 0, 0, 0.07),
                0 4px 8px rgba(0, 0, 0, 0.05),
                0 12px 24px rgba(0, 0, 0, 0.08),
                0 24px 48px rgba(0, 0, 0, 0.04);
            transition: all 0.5s ease;
            overflow: hidden;
            border-radius: 2px;
            /* Paper texture using CSS gradients */
            background-image: 
                radial-gradient(ellipse at 15% 10%, rgba(0,0,0,0.015) 0%, transparent 40%),
                radial-gradient(ellipse at 85% 90%, rgba(0,0,0,0.02) 0%, transparent 40%),
                radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0.005) 0%, transparent 70%);
        }

        .notebook-page.a4 {
            width: var(--a4-width);
            height: var(--a4-height);
            min-height: 80vh;
        }

        .notebook-page.a5 {
            width: var(--a5-width);
            height: var(--a5-height);
            min-height: 60vh;
        }

        .paper {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--paper-color);
            padding: var(--margin-width);
        }

        /* Drawing area */
        .drawing-area {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 10;
            cursor: crosshair;
            pointer-events: none;
        }

        /* Content area for typing */
        .content-area {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 5;
            padding: var(--margin-width);
            font-family: 'Courier New', monospace;
            line-height: var(--line-spacing);
            font-size: 1rem;
            outline: none;
            overflow-y: auto;
            resize: none;
            border: none;
            background: transparent;
            white-space: pre-wrap;
        }

        /* Status bar */
        .status-bar {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 800px;
            padding: 10px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 5px;
            font-size: 0.9rem;
            color: var(--dark);
            flex-wrap: wrap;
            gap: 10px;
        }

        /* Drawing mode */
        .drawing-mode .content-area {
            z-index: 5;
            pointer-events: none;
            opacity: 0.3;
        }

        .drawing-mode .drawing-area {
            z-index: 10;
            pointer-events: auto;
        }

        /* Animation */
        @keyframes pageTransition {
            0% { transform: scale(0.95); opacity: 0.5; }
            100% { transform: scale(1); opacity: 1; }
        }

        .notebook-page {
            animation: pageTransition 0.5s ease;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .app-header {
                flex-direction: column;
                text-align: center;
            }
            
            .controls {
                width: 100%;
                justify-content: center;
            }
            
            .notebook-page {
                width: 95% !important;
                min-height: 50vh !important;
            }
            
            .paper {
                padding: 15px;
            }
            
            .content-area {
                padding: 15px;
                font-size: 0.9rem;
            }
            
            .status-bar {
                flex-direction: column;
                text-align: center;
            }
        }

        /* Print styles */
        @media print {
            body {
                background: white;
                padding: 0;
            }
            
            #app {
                padding: 0;
            }
            
            .app-header, .controls, .status-bar {
                display: none !important;
            }
            
            .notebook-page {
                box-shadow: none;
                margin: 0;
                width: 100% !important;
                height: auto !important;
                min-height: auto !important;
                page-break-after: always;
            }
            
            .paper {
                padding: 0;
            }
            
            .content-area {
                padding: 0;
                height: 100%;
            }
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="app-header">
            <h1>No Homework Notebook</h1>
            <div class="controls">
                <button class="size-btn active" data-size="a4">A4</button>
                <button class="size-btn" data-size="a5">A5</button>
                <button class="control-btn" id="drawBtn">Draw</button>
                <button class="control-btn" id="clearBtn">Clear</button>
                <button class="control-btn" id="exportBtn">Export</button>
            </div>
            <div class="controls ink-controls">
                <label class="ink-label" for="inkColor">Ink</label>
                <input type="color" id="inkColor" value="#000000" title="Ink color">
                <select id="inkWeight" title="Pen thickness">
                    <option value="1">Fine</option>
                    <option value="2" selected>Medium</option>
                    <option value="4">Bold</option>
                    <option value="7">Marker</option>
                </select>
            </div>
            <div class="ruling-info">
                <span>Line Spacing: <span id="lineSpacing">8mm</span></span>
                <span>Standard: <span id="standard">German DIN</span></span>
            </div>
        </div>
        
        <div class="notebook-container">
            <div class="notebook-page a4" id="notebookPage">
                <div class="content-area" contenteditable="true" id="contentArea"></div>
            </div>
        </div>
        
        <div class="status-bar">
            <span>GPU Acceleration: <span id="gpuStatus">Checking...</span></span>
            <span>Rendering: <span id="renderMode">Canvas 2D</span></span>
            <span id="saveStatus">Auto-save</span>
        </div>
    </div>
    
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
